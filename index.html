<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바이브 코딩 쇼케이스 // AI와 함께 만든 것들</title>
<meta name="description" content="AI와 짝을 이뤄 만든 30여 개의 프로젝트. 동네 주민 코딩 교육용 포트폴리오.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@500;700;900&family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet">
<style>
  :root{
    --bg:#FFFDF5;
    --ink:#000000;
    --red:#FF6B6B;
    --yellow:#FFD93D;
    --violet:#C4B5FD;
    --white:#FFFFFF;
    --sky:#7DD3FC;
    --lime:#A3E635;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Gothic A1','Space Grotesk',sans-serif;font-weight:700;
    background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    background-image:
      linear-gradient(to right, rgba(0,0,0,.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,0,0,.06) 1px, transparent 1px),
      radial-gradient(#000 1.4px, transparent 1.5px);
    background-size:44px 44px, 44px 44px, 22px 22px;
    background-position:0 0,0 0,0 0;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px;position:relative;z-index:1}
  ::selection{background:var(--yellow)}

  /* ---------- HERO ---------- */
  header.hero{padding:60px 0 24px;position:relative}
  .marquee{
    border-top:4px solid var(--ink);border-bottom:4px solid var(--ink);background:var(--red);
    overflow:hidden;white-space:nowrap;margin-bottom:46px;
  }
  .marquee .track{display:inline-block;padding:9px 0;animation:scroll 22s linear infinite}
  .marquee span{font-family:'Space Grotesk';font-weight:700;text-transform:uppercase;letter-spacing:.18em;
    font-size:.95rem;color:var(--white);text-shadow:2px 2px 0 #000}
  .marquee span::after{content:"✦";margin:0 22px;color:var(--ink);text-shadow:none}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  .hero-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:30px;align-items:center}
  .kicker{display:inline-block;background:var(--ink);color:var(--yellow);
    font-family:'Space Grotesk';font-weight:700;text-transform:uppercase;letter-spacing:.2em;font-size:.8rem;
    padding:7px 14px;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--violet);transform:rotate(-2deg)}
  h1.title{font-family:'Black Han Sans',sans-serif;font-weight:400;line-height:.92;margin:24px 0 0;
    font-size:clamp(3rem,9vw,6.2rem);letter-spacing:-.01em}
  h1.title .l1{display:block;transform:rotate(-1.5deg)}
  h1.title .hl{background:var(--red);color:var(--white);padding:0 .12em;border:4px solid var(--ink);
    box-shadow:8px 8px 0 var(--ink);display:inline-block;transform:rotate(1.5deg);margin-top:.08em}
  h1.title .stroke{-webkit-text-stroke:2.5px var(--ink);color:transparent}
  .sub{font-size:1.12rem;font-weight:700;margin-top:26px;max-width:540px;line-height:1.6}
  .sub b{background:var(--yellow);border:2px solid var(--ink);padding:0 5px}

  .hero-card{background:var(--white);border:4px solid var(--ink);box-shadow:12px 12px 0 var(--ink);
    padding:22px;transform:rotate(2deg)}
  .hero-card .big{font-family:'Black Han Sans';font-size:4.2rem;line-height:1;color:var(--red);
    -webkit-text-stroke:2px #000}
  .hero-card .lbl{font-family:'Space Grotesk';font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:.82rem;margin-top:6px}
  .hero-card .row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .hero-card .mini{flex:1;min-width:74px;border:3px solid var(--ink);padding:8px 6px;text-align:center}
  .hero-card .mini.y{background:var(--yellow)}
  .hero-card .mini.v{background:var(--violet)}
  .hero-card .mini.s{background:var(--sky)}
  .hero-card .mini .n{font-family:'Black Han Sans';font-size:1.7rem;line-height:1}
  .hero-card .mini .t{font-size:.7rem;font-weight:700;margin-top:2px}

  /* ---------- FILTER ---------- */
  .filters{position:sticky;top:0;z-index:30;background:var(--bg);
    border-bottom:4px solid var(--ink);padding:14px 0;margin:54px 0 0}
  .filters-inner{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .chip{font-family:'Gothic A1';font-weight:900;cursor:pointer;border:3px solid var(--ink);
    background:var(--white);color:var(--ink);padding:8px 15px;font-size:.92rem;
    box-shadow:4px 4px 0 var(--ink);transition:transform .1s ease, box-shadow .1s ease, background .1s ease;}
  .chip:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink);background:var(--yellow)}
  .chip:active{transform:translate(4px,4px);box-shadow:none}
  .chip.active{background:var(--ink);color:var(--bg);box-shadow:4px 4px 0 var(--red)}

  /* ---------- CATEGORY ---------- */
  .cat{padding:54px 0 8px}
  .cat-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .cat-num{font-family:'Space Grotesk';font-weight:700;font-size:1.1rem;
    border:3px solid var(--ink);background:var(--violet);padding:4px 11px;box-shadow:4px 4px 0 var(--ink);transform:rotate(-3deg)}
  .cat-emoji{font-size:2rem}
  .cat-title{font-family:'Black Han Sans';font-weight:400;font-size:clamp(1.7rem,5vw,2.7rem);
    text-transform:uppercase;letter-spacing:-.01em}
  .cat-title .c{font-family:'Space Grotesk';font-size:1rem;vertical-align:super;color:var(--red);-webkit-text-stroke:1px #000}
  .cat-blurb{font-weight:700;max-width:780px;margin:12px 0 0;font-size:1rem;
    background:var(--white);border:3px solid var(--ink);padding:11px 15px;box-shadow:6px 6px 0 var(--ink)}
  .cat-rule{height:6px;background:var(--ink);margin:24px 0 28px}

  /* ---------- CARDS ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:26px}
  .card{background:var(--white);border:4px solid var(--ink);box-shadow:9px 9px 0 var(--ink);
    padding:20px;position:relative;display:flex;flex-direction:column;
    transition:transform .15s ease, box-shadow .15s ease;}
  .card:hover{transform:translate(-3px,-5px);box-shadow:14px 14px 0 var(--ink)}
  .card .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px}
  .card .folder{font-family:'Space Grotesk';font-weight:700;font-size:.74rem;text-transform:lowercase;
    background:var(--ink);color:var(--bg);padding:3px 9px;letter-spacing:.03em}
  .card .pin{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);flex:none}
  .card h3{font-family:'Black Han Sans';font-weight:400;font-size:1.42rem;line-height:1.18;margin-bottom:8px}
  .card .one{font-weight:700;font-size:.95rem;margin-bottom:14px;line-height:1.45}
  .card .does{list-style:none;margin:0 0 14px;display:flex;flex-direction:column;gap:6px}
  .card .does li{font-size:.88rem;font-weight:500;padding-left:22px;position:relative;line-height:1.4}
  .card .does li::before{content:"▸";position:absolute;left:2px;color:var(--ink);font-weight:900}
  .stack{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
  .tag{font-family:'Space Grotesk';font-weight:700;font-size:.72rem;background:var(--bg);
    border:2px solid var(--ink);padding:2px 7px}
  .learn{margin-top:auto;background:var(--yellow);border:3px solid var(--ink);padding:13px 14px;
    box-shadow:5px 5px 0 var(--ink)}
  .learn .lh{font-family:'Black Han Sans';font-weight:400;font-size:1rem;margin-bottom:7px;
    text-transform:uppercase;letter-spacing:.02em}
  .learn ul{list-style:none;display:flex;flex-direction:column;gap:5px}
  .learn li{font-size:.84rem;font-weight:700;padding-left:20px;position:relative;line-height:1.35}
  .learn li::before{content:"★";position:absolute;left:0;color:var(--ink)}
  .card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
  .status{font-family:'Space Grotesk';font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;
    padding:4px 9px;border:2px solid var(--ink)}
  .status.working{background:var(--lime)}
  .status.prototype,.status.wip{background:var(--violet)}
  .status.proposal{background:var(--sky)}
  .live{font-family:'Space Grotesk';font-weight:700;font-size:.8rem;text-decoration:none;color:var(--ink);
    background:var(--red);border:2px solid var(--ink);padding:4px 9px;box-shadow:3px 3px 0 var(--ink);
    transition:transform .1s ease, box-shadow .1s ease}
  .live:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .live:active{transform:translate(3px,3px);box-shadow:none}
  .live::before{content:"↗ "}

  /* ---------- LESSONS ---------- */
  .lessons{margin:80px 0 0;background:var(--ink);color:var(--bg);border:4px solid var(--ink);
    box-shadow:16px 16px 0 var(--red);padding:50px 30px}
  .lessons h2{font-family:'Black Han Sans';font-weight:400;font-size:clamp(2rem,6vw,3.2rem);
    text-align:center;text-transform:uppercase}
  .lessons h2 .hl{background:var(--yellow);color:var(--ink);padding:0 .12em;display:inline-block;transform:rotate(-2deg)}
  .lessons .lead{text-align:center;font-weight:700;max-width:560px;margin:14px auto 34px;color:#E5E5E5}
  .lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px}
  .lesson{background:var(--bg);color:var(--ink);border:4px solid #fff;padding:20px;box-shadow:7px 7px 0 var(--violet)}
  .lesson:nth-child(2n){box-shadow:7px 7px 0 var(--yellow)}
  .lesson:nth-child(3n){box-shadow:7px 7px 0 var(--sky)}
  .lesson .ln{font-family:'Space Grotesk';font-weight:700;font-size:2rem;-webkit-text-stroke:1.5px #000;color:var(--red)}
  .lesson h4{font-family:'Black Han Sans';font-weight:400;font-size:1.2rem;margin:6px 0 8px;line-height:1.2}
  .lesson p{font-size:.86rem;font-weight:500;line-height:1.5}

  /* ---------- FOOTER ---------- */
  footer{padding:56px 0 80px;text-align:center}
  .footer-quote{background:var(--yellow);border:4px solid var(--ink);box-shadow:10px 10px 0 var(--ink);
    display:inline-block;padding:22px 30px;transform:rotate(-1.5deg);max-width:680px}
  .footer-quote p{font-family:'Black Han Sans';font-weight:400;font-size:clamp(1.1rem,3vw,1.5rem);line-height:1.3}
  footer .small{font-family:'Space Grotesk';font-weight:700;text-transform:uppercase;letter-spacing:.12em;
    font-size:.78rem;margin-top:22px}

  .loading,.errbox{text-align:center;padding:70px 20px;font-weight:700}
  .errbox code{background:var(--yellow);border:2px solid var(--ink);padding:2px 7px;font-family:'Space Grotesk'}

  .reveal{opacity:0;transform:translateY(22px)}
  .reveal.in{opacity:1;transform:none;transition:opacity .35s ease-out, transform .35s ease-out}

  @media(max-width:760px){
    .hero-grid{grid-template-columns:1fr}
    .hero-card{transform:rotate(1deg);margin-top:8px}
    .lessons{box-shadow:8px 8px 0 var(--red)}
  }
  @media(prefers-reduced-motion:reduce){
    .marquee .track{animation:none}
    .reveal{opacity:1;transform:none}
  }
</style>
</head>
<body>

  <div class="marquee" aria-hidden="true">
    <div class="track" id="marqueeTrack"></div>
  </div>

  <div class="wrap">
    <header class="hero">
      <div class="hero-grid">
        <div>
          <span class="kicker">동네 코딩 교실 · 포트폴리오</span>
          <h1 class="title">
            <span class="l1">바이브</span>
            <span class="hl">코딩</span>
            <span class="stroke">쇼케이스</span>
          </h1>
          <p class="sub" id="sub"></p>
        </div>
        <aside class="hero-card" id="heroCard"></aside>
      </div>
    </header>
  </div>

  <nav class="filters">
    <div class="wrap"><div class="filters-inner" id="filters"></div></div>
  </nav>

  <div class="wrap">
    <main id="catalog"><div class="loading">프로젝트 불러오는 중… ▰▰▰▱▱</div></main>
    <section class="lessons reveal" id="lessons"></section>
    <footer>
      <div class="footer-quote">
        <p>"거창하지 않아도,<br>직접 굴러가는 걸 만드는 게<br>코딩의 시작이다."</p>
      </div>
      <p class="small">made with ❤️ and claude - <span id="count2"></span> PROJECT - 2026</p>
    </footer>
  </div>

<script>
const PINS = ['var(--red)','var(--yellow)','var(--violet)','var(--sky)','var(--lime)'];
const STATUS_LABEL = {working:'돌아가는 중',prototype:'프로토타입',wip:'개발 중',proposal:'제안서'};
const ROT = ['-1.2deg','0.8deg','-0.6deg','1.1deg','-0.9deg','0.5deg'];

function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}

function card(p, idx){
  const c = el('div','card reveal');
  c.dataset.cat = p._cat;
  c.style.transform = 'rotate(0deg)';
  c.style.setProperty('--rot', ROT[idx%ROT.length]);

  const top = el('div','topbar');
  top.appendChild(el('span','folder', p.folder));
  const pin = el('span','pin'); pin.style.background = PINS[idx%PINS.length]; top.appendChild(pin);
  c.appendChild(top);

  c.appendChild(el('h3', null, p.name));
  c.appendChild(el('p','one', p.oneLiner));

  const ul = el('ul','does');
  (p.does||[]).forEach(d => ul.appendChild(el('li',null,d)));
  c.appendChild(ul);

  const st = el('div','stack');
  (p.stack||[]).forEach(s => st.appendChild(el('span','tag',s)));
  c.appendChild(st);

  const learn = el('div','learn');
  learn.appendChild(el('div','lh','🎓 배울 수 있는 것'));
  const lu = el('ul');
  (p.learn||[]).forEach(l => lu.appendChild(el('li',null,l)));
  learn.appendChild(lu);
  c.appendChild(learn);

  const foot = el('div','card-foot');
  foot.appendChild(el('span','status '+(p.status||'working'), STATUS_LABEL[p.status]||p.status));
  if(p.live){
    const a = el('a','live', p.live.replace(/^https?:\/\//,''));
    a.href = p.live; a.target='_blank'; a.rel='noopener'; foot.appendChild(a);
  }
  c.appendChild(foot);
  return c;
}

function render(data){
  const total = data.categories.reduce((n,c)=>n+c.projects.length,0);
  const working = data.categories.reduce((a,c)=>a+c.projects.filter(p=>p.status==='working').length,0);
  document.getElementById('count2').textContent = total;
  document.getElementById('sub').innerHTML =
    'AI와 짝을 이뤄 만든 <b>30여 개</b>의 작은 프로젝트들. 웹·앱·자동화·보안까지, 직접 굴러가는 것들만 모았다.';

  // marquee
  const words = ['VIBE CODING','웹 서비스','자동화 봇','모바일 앱','데스크탑 도구','보안 인프라','직접 만든다','★'];
  const tr = document.getElementById('marqueeTrack');
  let html=''; for(let i=0;i<2;i++){ words.forEach(w=> html+='<span>'+w+'</span>'); }
  tr.innerHTML = html;

  // hero card
  const hc = document.getElementById('heroCard');
  hc.innerHTML = '<div class="big">'+total+'</div><div class="lbl">Projects Built</div>'+
    '<div class="row">'+
      '<div class="mini y"><div class="n">'+data.categories.length+'</div><div class="t">분야</div></div>'+
      '<div class="mini v"><div class="n">'+working+'</div><div class="t">작동 중</div></div>'+
      '<div class="mini s"><div class="n">∞</div><div class="t">배울거리</div></div>'+
    '</div>';

  // filters
  const filters = document.getElementById('filters');
  const all = el('button','chip active','✺ 전체'); all.dataset.cat='all'; filters.appendChild(all);
  data.categories.forEach(c=>{
    const b=el('button','chip', c.emoji+' '+c.name); b.dataset.cat=c.id; filters.appendChild(b);
  });

  // catalog
  const cat = document.getElementById('catalog'); cat.innerHTML='';
  data.categories.forEach((c,ci)=>{
    const sec = el('section','cat'); sec.dataset.cat = c.id;
    const head = el('div','cat-head');
    head.appendChild(el('span','cat-num', String(ci+1).padStart(2,'0')));
    head.appendChild(el('span','cat-emoji', c.emoji));
    head.appendChild(el('h2','cat-title', c.name+' <span class="c">'+c.projects.length+'</span>'));
    sec.appendChild(head);
    sec.appendChild(el('p','cat-blurb', c.blurb));
    sec.appendChild(el('div','cat-rule'));
    const grid = el('div','grid');
    c.projects.forEach((p,pi)=>{ p._cat=c.id; grid.appendChild(card(p, ci+pi)); });
    sec.appendChild(grid);
    cat.appendChild(sec);
  });

  // lessons
  const L = document.getElementById('lessons');
  L.appendChild(el('h2','','여러분이 <span class="hl">배울 수 있는 것</span>'));
  L.appendChild(el('p','lead','작은 프로젝트 하나하나가 코딩의 다른 근육을 길러준다.'));
  const lg = el('div','lgrid');
  (data.lessons||[]).forEach((les,i)=>{
    const d=el('div','lesson');
    d.appendChild(el('div','ln', String(i+1).padStart(2,'0')));
    d.appendChild(el('h4',null,les.title));
    d.appendChild(el('p',null,les.body));
    lg.appendChild(d);
  });
  L.appendChild(lg);

  setupFilter(); setupReveal();
}

function setupFilter(){
  const chips=[...document.querySelectorAll('.chip')];
  const sections=[...document.querySelectorAll('.cat')];
  chips.forEach(ch=>ch.addEventListener('click',()=>{
    chips.forEach(c=>c.classList.remove('active')); ch.classList.add('active');
    const t=ch.dataset.cat;
    sections.forEach(s=>{ s.style.display = (t==='all'||s.dataset.cat===t)?'':'none'; });
    window.scrollTo({top: document.querySelector('.filters').offsetTop, behavior:'smooth'});
  }));
}
function setupReveal(){
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} });
  },{threshold:.06});
  document.querySelectorAll('.reveal').forEach((r,i)=>{ r.style.transitionDelay=(Math.min(i,6)*45)+'ms'; io.observe(r); });
}

fetch('./projects.json')
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(err=>{
    document.getElementById('catalog').innerHTML =
      '<div class="errbox">데이터를 불러오지 못했어요.<br><br>'+
      '로컬에서 직접 열면 막힐 수 있어요. <code>npx serve</code> 로 띄우거나 Cloudflare Pages에 배포하세요.<br>'+
      '<small>('+err+')</small></div>';
  });
</script>
</body>
</html>
